<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deepanchakkaravarthi G | Senior Application Support Engineer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      background: #16181f;
      max-width: 600px;
      width: 90%;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .title {
      font-size: 1rem;
      color: #7b8cde;
      margin-top: 0.5rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2d3a;
      margin: 1.5rem auto;
      width: 60%;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 1rem 0;
    }

    .tag {
      background: #1e2130;
      border: 1px solid #2e3250;
      color: #a0aec0;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .badge {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #48bb78;
      background: #1a2e22;
      border: 1px solid #2d5a3d;
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Deepanchakkaravarthi G</h1>
    <p class="title">Senior Application Support Engineer</p>

    <hr class="divider" />

    <div class="tags">
      <span class="tag">Application Support</span>
      <span class="tag">Production Operations</span>
      <span class="tag">AWS Application Support</span>
      <span class="tag">Release Coordination</span>
    </div>

    <hr class="divider" />

    <span class="badge">🚀 CareerHub v1.0 is live</span>
  </div>
</body>
</html>
