    career_title: Senior Application Support Engineer

    engagement_role: Release & Application Operations Coordinator

    display_title: >
      Senior Application Support Engineer |
      Release & Application Operations Coordinator

    official_designation: Senior Consultant

    employment_type: Full-time

    start_date: "2023-11"
    end_date: null
    current: true

    location:
      value: Bangalore, India
      display_publicly: true

    summary: >
      Supports application and release operations for an AWS-based
      microservices ecosystem across Disney WDW, DLR, and DLP production
      and non-production environments. Responsibilities include incident
      investigation, defect triage, deployment coordination, release
      readiness, post-deployment validation, monitoring, automation,
      and cross-team troubleshooting.

    responsibilities:
      - >
        Support application and release operations for 45+ AWS
        microservices across WDW, DLR, and DLP production and
        non-production environments.

      - >
        Troubleshoot issues identified during functional, regression,
        unit, and performance testing by reviewing application logs,
        service health, deployment status, configuration, data, and
        dependent-system behavior.

      - >
        Triage JIRA defects with testing partners and development teams,
        facilitate troubleshooting discussions and bridge calls,
        communicate application impact and findings, and coordinate fixes
        through validation.

      - >
        Coordinate builds and multi-environment deployments using AWS
        ECS, ECR, EC2, Jenkins, console and Vault updates, database
        scripts, Redis services, application services, and batch holds
        and releases.

      - >
        Perform post-deployment health checks, stability validation,
        service-health verification, and error analysis using Amazon
        CloudWatch, Grafana, Splunk, and AppDynamics.

      - >
        Prepare and execute release steps for RITM and change-controlled
        environments, support CCB and CAB approvals, maintain rollback
        readiness, and send release-window communications.

      - >
        Coordinate platform migrations, database upgrades, Java upgrades,
        service integration changes, and test automation initiatives
        while engineering teams own development and implementation.

      - >
        Create and enhance Python-based build and validation automation
        to reduce manual execution effort and improve repeatability.

    achievements:
      - id: disney-microservices-support
        description: >
          Supported application operations, release execution, and
          validation for 45+ AWS microservices across WDW, DLR, and DLP
          environments.

        metric:
          value: "45+"
          unit: AWS microservices

      - id: disney-python-automation
        description: >
          Reduced Build Team manual build and validation effort by 60%
          through updated Python-based automation.

        metric:
          value: "60%"
          unit: reduction in manual effort

    technologies:
